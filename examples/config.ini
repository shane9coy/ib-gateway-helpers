# Example IBC configuration for IB Gateway.
# Copy to ~/ibc/config.ini and edit.

# ── Login Settings ──────────────────────────────────────────────────────────
# TradingMode: paper or live.
# Override credentials with env vars (TWSUSERID, TWSPASSWORD) loaded from
# ~/ibc/credentials.env — DO NOT inline your password here.

[IB]
TradingMode=live
IbLoginTime=120
AcceptIncomingConnectionAction=accept
ExistingSessionDetectedAction=primary
IbLoginId=YOUR_USERNAME
IbPassword=YOUR_PASSWORD_HERE_OR_USE_ENV
# Auto-restart the Gateway daily so we don't have to manually re-authenticate.
# IB Gateway logs out once per week (Sun 01:00 ET) — with AutoRestart set,
# the Gateway auto-restarts and IBC re-runs the login without 2FA prompts
# (as long as the IBKR session is still valid in the same week).
AutoRestartTime=23:55
# Re-attempt login automatically if 2FA times out.
ReloginAfterSecondFactorAuthenticationTimeout=yes
# How long IBC waits after 2FA acknowledgement before giving up.
# Upstream default is 60s — too short for human SMS entry. 5 min is safer.
SecondFactorAuthenticationExitInterval=300
# Disable IB Gateway's "Read-Only API" mode so API clients can place orders.
ReadOnlyApi=no

[Other]
ShowAllDialogs=yes
ForceTWSApiClientRedirect=

# ── Command server (so commandsend.sh can drive SMS code, restart, etc.) ──
[TWS]
CommandServerPort=7462
